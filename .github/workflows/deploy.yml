name: Deploy
on:
  push:
    branches: [main]
  # 翻訳リポジトリ側の更新を取り込むため毎日ビルド
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 1ターゲット = 1 Cloudflare Pages プロジェクト = 1サブドメイン
        target: [portal, rust, go, nodejs]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - run: git submodule update --remote --recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          TARGET: ${{ matrix.target }}
      - run: >-
          bunx wrangler@4 pages deploy .vitepress/dist/${{ matrix.target }}
          --project-name tdocsjp-${{ matrix.target }} --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
